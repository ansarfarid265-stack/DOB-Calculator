
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronos | Age Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#e9c58c;--purple:#b49aff;--cyan:#83e8ff;--text:#f8f6ff}
body{
 min-height:100vh;display:grid;place-items:center;padding:24px;
 font-family:'Inter',sans-serif;color:var(--text);overflow-x:hidden;
 background:radial-gradient(ellipse at 15% 10%,#39205b 0,transparent 38%),
 radial-gradient(ellipse at 90% 85%,#123b55 0,transparent 35%),#080a14
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.3;
 background-image:radial-gradient(1px 1px at 15% 25%,white 99%,transparent),
 radial-gradient(2px 2px at 80% 15%,#e9c58c 99%,transparent),
 radial-gradient(1px 1px at 70% 70%,white 99%,transparent),
 radial-gradient(2px 2px at 25% 85%,#b49aff 99%,transparent);
 background-size:230px 230px;animation:stars 18s linear infinite}
@keyframes stars{to{background-position:230px 230px}}
.float{position:fixed;font-size:27px;opacity:.35;pointer-events:none;
 animation:drift 8s ease-in-out infinite}
.f1{top:12%;left:9%}.f2{top:18%;right:10%;animation-delay:2s}
.f3{bottom:13%;left:12%;animation-delay:3s}.f4{bottom:18%;right:8%;animation-delay:1s}
@keyframes drift{50%{transform:translateY(-25px) rotate(12deg)}}
.container{
 width:100%;max-width:465px;position:relative;padding:35px;
 border-radius:25px;background:linear-gradient(145deg,#171927ed,#101522ed);
 border:1px solid #b49aff50;backdrop-filter:blur(20px);
 box-shadow:0 30px 100px #0009,0 0 50px #9874ff12;
 animation:appear .8s ease
}
.container:before{content:"";position:absolute;inset:-1px;border-radius:25px;
 padding:1px;background:linear-gradient(135deg,#e9c58c80,#b49aff70,transparent,#83e8ff60);
 -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
 -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
@keyframes appear{from{opacity:0;transform:translateY(25px) scale(.98)}
 to{opacity:1;transform:translateY(0) scale(1)}}
.eyebrow{text-align:center;font-size:10px;letter-spacing:4px;color:var(--gold);
 font-weight:700;margin-bottom:23px}
.icon{text-align:center;font-size:39px;margin-bottom:12px;
 filter:drop-shadow(0 0 16px #b49aff70);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
h1{text-align:center;font:600 clamp(30px,7vw,39px)/1.2 'Playfair Display',serif;
 letter-spacing:-.7px;background:linear-gradient(100deg,#fff1d7,#e9c58c,#c5b5ff);
 background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{text-align:center;color:#a8aec5;font-size:13px;line-height:1.9;margin:14px 0 30px}
label{display:block;color:#e1d9f1;font-size:11px;font-weight:700;
 letter-spacing:1.6px;margin-bottom:11px}
input[type=date]{width:100%;padding:15px;border:1px solid #41435c;
 border-radius:12px;background:#111421;color:#f8f6ff;color-scheme:dark;
 outline:none;font:500 13px 'Inter',sans-serif;margin-bottom:19px;transition:.3s}
input:focus{border-color:var(--purple);box-shadow:0 0 0 4px #b49aff19}
button{width:100%;padding:16px;border:1px solid #ffffff28;border-radius:12px;
 background:linear-gradient(105deg,#c4a0ff,#e8c18b,#c5a0ff);
 background-size:200% 100%;color:#171321;font-size:13px;font-weight:800;
 letter-spacing:.4px;cursor:pointer;transition:.35s}
button:hover{background-position:100% 0;transform:translateY(-3px);
 box-shadow:0 10px 30px #b49aff35}
button:active{transform:scale(.98)}
#message{text-align:center;color:#ffaaaa;font-size:12px;margin-top:12px}
.result{display:none;margin-top:27px;padding:22px 14px;border-radius:17px;
 border:1px solid #ffffff1c;background:linear-gradient(145deg,#ffffff08,#b49aff05)}
.result.show{display:block;animation:appear .55s ease}
h2{text-align:center;font:600 20px 'Playfair Display',serif;color:var(--gold);margin-bottom:21px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.card{padding:18px 3px;text-align:center;border-radius:12px;
 transition:transform .3s,border-color .3s,box-shadow .3s}
.card:hover{transform:translateY(-6px);box-shadow:0 12px 25px #0004}
.card:nth-child(1){background:#a879ff12;border:1px solid #b49aff75}
.card:nth-child(2){background:#55dcff0d;border:1px solid #83e8ff65}
.card:nth-child(3){background:#e9c58c0c;border:1px solid #e9c58c70}
.symbol{font-size:21px;margin-bottom:7px}
.num{font-size:clamp(27px,7vw,35px);font-weight:800;letter-spacing:-1px;margin-bottom:7px}
.card:nth-child(1) .num{color:#c7acff}
.card:nth-child(2) .num{color:#83e8ff}
.card:nth-child(3) .num{color:#e9c58c}
.card small{font-size:9px;letter-spacing:1.8px;color:#c4c8d9}
.footer{text-align:center;margin-top:23px;color:#9299b1;font-size:11px;letter-spacing:.6px}
.footer span{color:var(--gold);display:inline-block;animation:heart 1.6s infinite}
@keyframes heart{50%{transform:scale(1.3)}}
@media(max-width:390px){.container{padding:25px 17px}.cards{gap:6px}
 .card{padding:15px 2px}.card small{letter-spacing:1px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="float f1">✦</div><div class="float f2">🌙</div>
<div class="float f3">✨</div><div class="float f4">🪐</div>
<main class="container">
 <div class="eyebrow">✧ &nbsp; YOUR PERSONAL TIMELINE &nbsp; ✧</div>
 <div class="icon">⌛</div>
 <h1>Age Calculator</h1>
 <p class="subtitle">Time is the most beautiful story.<br>Discover the chapters you've lived. ✨</p>
 <label for="birthdate">DATE OF BIRTH</label>
 <input type="date" id="birthdate">
 <button onclick="calculateAge()">✦ &nbsp; REVEAL MY AGE &nbsp; →</button>
 <p id="message" role="alert" aria-live="polite"></p>
 <section class="result" id="result" aria-live="polite">
  <h2>Your Journey So Far</h2>
  <div class="cards">
   <div class="card"><div class="symbol">📆</div><div class="num" id="years">0</div><small>YEARS</small></div>
   <div class="card"><div class="symbol">⏳</div><div class="num" id="months">0</div><small>MONTHS</small></div>
   <div class="card"><div class="symbol">☀️</div><div class="num" id="days">0</div><small>DAYS</small></div>
  </div>
  <p class="footer">MADE OF MOMENTS &nbsp; <span>♥</span> &nbsp; MADE OF MEMORIES</p>
 </section>
</main>
<script>
const input=document.getElementById('birthdate');
const result=document.getElementById('result');
const message=document.getElementById('message');
function todayDate(){
 const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());
}
function formatDate(d){
 return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
input.max=formatDate(todayDate());
function calculateAge(){
 message.textContent='';result.classList.remove('show');result.style.display='none';
 if(!input.value){message.textContent='Please select your date of birth ✨';return;}
 const [y,m,d]=input.value.split('-').map(Number);
 const birth=new Date(y,m-1,d),today=todayDate();
 if(birth.getFullYear()!==y||birth.getMonth()!==m-1||birth.getDate()!==d||birth>today){
 message.textContent='Please select a valid date of birth.';return;}
 let years=today.getFullYear()-y,months=today.getMonth()-(m-1),days=today.getDate()-d;
 if(days<0){months--;days+=new Date(today.getFullYear(),today.getMonth(),0).getDate();}
 if(months<0){years--;months+=12;}
 document.getElementById('years').textContent=years;
 document.getElementById('months').textContent=months;
 document.getElementById('days').textContent=days;
 result.style.display='block';void result.offsetWidth;result.classList.add('show');
}
</script>
</body>
</html>
